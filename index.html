<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff1d6">
  <title>Startup Ladder (prototype)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <!-- Pebblewick, rendered by town-stage.js behind the cards -->
  <canvas id="town" aria-hidden="true"></canvas>
  <div id="app">
    <header class="hud is-hidden" id="hud">
      <div class="hud-row">
        <span class="pill" id="hud-level">LVL 1</span>
        <span class="hud-company" id="hud-company">Untitled Startup</span>
      </div>
      <div class="meters">
        <div class="meter meter-cash" data-meter="cash">
          <span class="meter-icon" aria-hidden="true">💰</span>
          <div class="meter-body">
            <div class="meter-label"><span class="meter-name">Cash</span> <b class="meter-val">$10,000</b></div>
            <div class="meter-bar"><i class="meter-fill"></i><i class="meter-ghost"></i></div>
          </div>
          <span class="meter-tag"></span>
          <span class="meter-pv"></span>
        </div>
        <div class="meter meter-rep" data-meter="rep">
          <span class="meter-icon" aria-hidden="true">🌟</span>
          <div class="meter-body">
            <div class="meter-label"><span class="meter-name">Rep</span> <b class="meter-val">0/10</b></div>
            <div class="pips"></div>
          </div>
          <span class="meter-tag"></span>
          <span class="meter-pv"></span>
        </div>
        <div class="meter meter-chaos" data-meter="chaos">
          <span class="meter-icon" aria-hidden="true">🔥</span>
          <div class="meter-body">
            <div class="meter-label"><span class="meter-name">Chaos</span> <b class="meter-val">0/10</b></div>
            <div class="pips"></div>
          </div>
          <span class="meter-tag"></span>
          <span class="meter-pv"></span>
        </div>
      </div>
      <div class="compass" id="hud-compass" aria-live="polite" hidden>
        <span class="compass-label">Ending</span> <b class="compass-now"></b><span class="compass-next"></span>
      </div>
    </header>

    <main class="stage" id="stage"></main>

    <footer class="controls" id="controls"></footer>
  </div>

  <script src="story.js"></script>
  <script src="game.js"></script>
  <script type="module" src="town-stage.js"></script>
</body>
</html>
